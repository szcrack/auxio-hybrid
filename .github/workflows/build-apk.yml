name: Build Auxio Hybrid APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Install system build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libutfcpp-dev

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure Submodules
        run: |
          if [ ! -d "media/build-logic-settings" ]; then
            rm -rf media
            git clone --depth 1 -b release https://github.com/OxygenCobalt/media.git media
          fi
          sed -i 's/"Media3 FFmpeg decoder module",/"Media3 FFmpeg decoder module",\n          includeInCompositeBuild = false,/g' media/build-logic-settings/src/main/kotlin/androidx/media3/buildlogic/Media3Modules.kt
          if [ ! -f "musikr/src/main/cpp/taglib/CMakeLists.txt" ]; then
            rm -rf musikr/src/main/cpp/taglib
            mkdir -p musikr/src/main/cpp
            git clone --depth 1 https://github.com/taglib/taglib.git musikr/src/main/cpp/taglib
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auxio-Hybrid-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
